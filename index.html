<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#FBF7F3; --card:#FFFFFF; --ink:#3A2A22; --ink2:#7C6459; --line:#EADCD2;
    --brand:#8C3B2E; --out:#B4543A; --in:#3C7A5F; --soft:#F6EDE6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-text-size-adjust:100%;}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 128px}
  header{padding:22px 4px 12px}
  h1{font-size:21px;margin:0;letter-spacing:.5px}
  .sub{font-size:12px;color:var(--ink2);margin-top:6px}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .stat .k{font-size:11px;color:var(--ink2)}
  .stat .v{font-size:17px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .stat.wide{grid-column:span 2;background:var(--soft);border-color:#E3D2C6}
  .stat.wide .row{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 8px}
  .stat.wide .v{font-size:19px;white-space:nowrap}
  .rangeTip{font-size:11px;color:#9A8375;margin:2px 4px 0;text-align:right}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink2);
    border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:2px 0 6px}
  .panel.on{display:block}
  .panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .panel label{display:block;font-size:11px;color:var(--ink2);margin-bottom:5px}
  .panel select,.panel input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;
    color:var(--ink);background:#fff;font-family:inherit;outline:none;-webkit-appearance:none}
  .panel .go{width:100%;margin-top:10px;background:var(--brand);color:#fff;border:0;border-radius:11px;padding:11px;
    font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}

  .searchbar{position:relative;margin:10px 0 8px}
  .searchbar input{width:100%;padding:13px 44px 13px 2.9em;border-radius:14px;border:1px solid var(--line);
    background:var(--card);font-size:15px;color:var(--ink);outline:none;font-family:inherit}
  .searchbar input:focus{border-color:#C79A86;box-shadow:0 0 0 3px rgba(140,59,46,.08)}

<body>
<div class="wrap">
  <header>
    <h1>礼金往来账本</h1>
    <div class="sub">记人情、算往来 · 家人各记各的 · 数据只存在本机</div>
  </header>

  <section class="stats">
    <div class="stat">
      <div class="k">支出</div>
      <div class="v" id="sumOut" style="color:var(--out)">0.00</div>
    </div>
    <div class="stat">
      <div class="k">收入</div>
      <div class="v" id="sumIn" style="color:var(--in)">0.00</div>
    </div>
  </section>
  <div class="rangeTip" id="rangeTip">全部记录</div>

  <div class="chips" id="chips">
    <button class="chip on" data-mode="all">全部</button>
    <button class="chip" data-mode="year">今年</button>
    <button class="chip" data-mode="month">本月</button>
    <button class="chip" data-mode="lastmonth">上月</button>
    <button class="chip" data-mode="pick">按月份</button>
    <button class="chip" data-mode="range">时间段</button>
  </div>

  <div class="panel" id="panelPick">
    <div class="grid">
      <div><label>年份</label><select id="fYear"></select></div>
      <div><label>月份</label><select id="fMonth"></select></div>
    </div>
    <button class="go" id="pickGo">查看这个月</button>
  </div>

  <div class="panel" id="panelRange">
    <div class="grid">
      <div><label>起始日期</label><input type="date" id="fFrom"></div>
      <div><label>结束日期</label><input type="date" id="fTo"></div>
    </div>
    <button class="go" id="rangeGo">查看这段时间</button>
  </div>

  <div class="searchbar">
    <span class="ico">⌕</span>
    <input id="q" type="search" placeholder="搜索姓名、关系、事类、事由或地点">
    <button class="clr" id="clr" aria-label="清空">×</button>
  </div>

  <div class="toolbar">
    <span class="count" id="count">共 0 笔</span>
    <div class="links">
      <button id="exportBtn">导出备份</button>
      <button id="importBtn">导入旧账</button>
      <button id="selBtn">批量删除</button>
      <button id="trashBtn">回收站</button>
    </div>
  </div>

  <div class="viewsw">
    <div class="vb on" id="vCard">卡片</div>
    <div class="vb" id="vTable">表格</div>
  </div>
  <div class="scopebar" id="scopebar">
    <div class="sb on" data-scope="in">只看收入</div>
    <div class="sb" data-scope="out">只看支出</div>
  </div>

  <div class="list" id="list"></div>
  <div id="sheetWrap"></div>
</div>

<button class="fab" id="addBtn">＋ 记一笔</button>

<div class="selbar" id="selbar">
  <span class="info" id="selInfo">已选 0 笔</span>
  <div class="acts">
    <button id="selAllBtn">全选</button>
    <button id="selDelBtn" class="primary">删除所选</button>
    <button id="selExitBtn">退出</button>
  </div>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <h2><span id="formTitle">记一笔</span><button id="cancelBtn">取消</button></h2>

  <div class="grid2">
    <div class="field"><label>日期</label><input type="date" id="fDate"></div>
    <div class="field"><label>姓名</label><input id="fName" placeholder="谁的人情" autocomplete="off"></div>
  </div>

  <div class="grid2">
    <div class="field"><label>关系</label>
      <select id="fRel">
        <option>亲属</option><option>亲戚</option><option>朋友</option><option>同学</option>
        <option>同事</option><option>邻居</option><option>其他</option>
      </select>
    </div>
    <div class="field"><label>事类</label>
      <select id="fType">
        <option>婚嫁</option><option>满月·百日</option><option>寿宴</option><option>乔迁</option>
        <option>升学</option><option>白事</option><option>其他</option>
      </select>
    </div>
  </div>

  <div class="field"><label>事由 / 场合</label><input id="fOcc" placeholder="例如：表哥婚宴、二叔家乔迁"></div>

  <div class="field"><label>地点（可选，自己填）</label><input id="fLoc" placeholder="例如：泸州江阳区、成都双流、老家镇上"></div>

  <div class="field"><label>礼物（实物，可选）</label><input id="fGift" placeholder="例如：花炮两桶、红糖一对、地票1对"></div>


  <div class="grid2">
    <div class="field"><label>支出（元）</label>
      <input id="fOut" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div>
    <div class="field"><label>收入（元）</label>
      <input id="fIn" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div>
  </div>
  <div class="hint">同一笔只填一侧：你送出去填「支出」，别人给你填「收入」。</div>

  <div class="field" style="margin-top:12px"><label>备注</label>
    <textarea id="fNote" rows="2" placeholder="可留空，例如：随礼人数、份子来源"></textarea></div>

      <div class="shotBtns">

        <button class="shotBtn" id="albumBtn" type="button">从相册选</button>
      </div>

      <div class="hint" style="margin-top:8px">拍下礼簿、红包或收条，留作核对凭证；照片只存在这台手机里。</div>
    </div>
    <input id="fileInput" type="file" accept="image/*" style="display:none">
  </div>

  <button class="save" id="saveBtn">保存</button>
  <button class="danger" id="delBtn">删除这笔记录</button>
</div>

<div class="confirmbox" id="confirmbox">
  <div class="cbcard">
    <div class="cbtext" id="cbText">确定吗？</div>
    <div class="cbacts">
      <button class="cbtn" id="cbNo">取消</button>
      <button class="cbtn red" id="cbYes">确定删除</button>
    </div>
  </div>

<div class="viewer" id="viewer">
  <button class="close" id="viewerClose">×</button>
  <img id="viewerImg" alt="">
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var KEY = 'gift_ledger_v1';
  var IDXKEY = 'gift_pic_index_v1';
  /* 内置记录：任何拿到本文件的人打开都能看到这些账目（本机编辑只影响自己这一份） */
  var SEED = [];
  var PAGE = 50;
  var TRASHKEY = 'gift_trash_v1';
  var TRASH_MAX = 50;             // 回收站最多存 50 条，超过的先删最旧的
  var records = load();
  var trash = loadTrash();
  var picIndex = loadIdx();       // {recordId: count}
  var pending = [];               // 编辑中的照片数据（dataURL）
  var previewUrls = [];           // 待释放的 objectURL
  var editingId = null;
  var lastPhotoTarget = 'camera';
  var viewMode = 'card';
  var tableScope = 'in';
  var filter = { mode:'all', year:null, month:null, from:'', to:'', limit:PAGE };
  var selMode = false, selIds = {}, lastShown = [];

  var $ = function(id){ return document.getElementById(id); };
  var listEl = $('list'), qEl = $('q'), mask = $('mask'), sheet = $('sheet');

  /* ---------- IndexedDB ---------- */
  var dbPromise = null;
  function db(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise(function(res, rej){
      if(!window.indexedDB){ rej(new Error('no idb')); return; }
      var req = indexedDB.open('gift_ledger', 1);
      req.onupgradeneeded = function(){
        var d = req.result;
        if(!d.objectStoreNames.contains('pics')) d.createObjectStore('pics');
      };
      req.onsuccess = function(){ res(req.result); };
      req.onerror = function(){ rej(req.error); };
    });
    return dbPromise;
  }
  function idbPut(id, arr){
    return db().then(function(d){
      return new Promise(function(res, rej){
        var tx = d.transaction('pics', 'readwrite');
        tx.objectStore('pics').put(arr, id);
        tx.oncomplete = function(){ res(true); };
        tx.onerror = function(){ rej(tx.error); };
      });
    });
  }
  function idbGet(id){
    return db().then(function(d){
      return new Promise(function(res, rej){
        var tx = d.transaction('pics', 'readonly');
        var r = tx.objectStore('pics').get(id);
        r.onsuccess = function(){ res(r.result || []); };
        r.onerror = function(){ rej(r.error); };
      });
    }).catch(function(){ return []; });
  }
  function idbDel(id){
    return db().then(function(d){
      return new Promise(function(res){
        var tx = d.transaction('pics', 'readwrite');
        tx.objectStore('pics').delete(id);
        tx.oncomplete = function(){ res(true); };
        tx.onerror = function(){ res(false); };
      });
    }).catch(function(){});
  }

  /* ---------- 本地存储 ---------- */
  function load(){ try{ var r = localStorage.getItem(KEY); if(r){ var d = JSON.parse(r); return Array.isArray(d) ? d : SEED.slice(); } }catch(e){} return SEED.slice(); }
  function loadIdx(){ try{ var r = localStorage.getItem(IDXKEY); return r ? JSON.parse(r) : {}; }catch(e){ return {}; } }
  function loadTrash(){ try{ var r = localStorage.getItem(TRASHKEY); var d = r ? JSON.parse(r) : []; return Array.isArray(d) ? d : []; }catch(e){ return []; } }
  function saveTrash(){ try{ localStorage.setItem(TRASHKEY, JSON.stringify(trash)); }catch(e){} }
  function toTrash(rec){
    var t = JSON.parse(JSON.stringify(rec));
    t.deletedAt = Date.now();
    trash.unshift(t);
    if(trash.length > TRASH_MAX) trash = trash.slice(0, TRASH_MAX);   // 超过 50 条，最旧的彻底清掉
    saveTrash();
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(records)); }catch(e){ toast('存储失败，可能是空间不足'); }
  }
  function saveIdx(){
    try{ localStorage.setItem(IDXKEY, JSON.stringify(picIndex)); }catch(e){}
  }
  function uid(){ return 'r' + Date.now() + Math.random().toString(16).slice(2,6); }

  /* ---------- 工具 ---------- */
  function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
  function money(n){ return n.toLocaleString('zh-CN',{minimumFractionDigits:2, maximumFractionDigits:2}); }
  function pad(n){ return String(n).padStart(2,'0'); }
  function today(){ var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function ymd(y,m){ return y + '-' + pad(m); }
  function stats(rows){
    var o = 0, i = 0;
    rows.forEach(function(r){ o += num(r.out); i += num(r.inn); });
    return { o:o, i:i, net:o-i, n:rows.length };
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------- 筛选 ---------- */
  function inFilter(r){
    var d = (r.date || '').slice(0,10);
    if(filter.mode === 'all') return true;
    if(filter.mode === 'year') return d.slice(0,4) === String(filter.year);
    if(filter.mode === 'month') return d.slice(0,7) === ymd(filter.year, filter.month);
    if(filter.mode === 'range'){
      if(filter.from && d < filter.from) return false;
      if(filter.to && d > filter.to) return false;
      return true;
    }
    return true;
  }
  function rangeLabel(){
    if(filter.mode === 'all') return '全部记录';
    if(filter.mode === 'year') return filter.year + ' 年';
    if(filter.mode === 'month') return filter.year + ' 年 ' + filter.month + ' 月';
    if(filter.mode === 'range') return (filter.from || '不限') + ' 至 ' + (filter.to || '不限');
    return '全部记录';
  }

  /* ---------- 渲染 ---------- */
  function render(){
    if(viewMode === 'trash'){ renderTrash(); return; }
    $('trashBtn').textContent = trash.length ? ('回收站 ' + trash.length) : '回收站';
    var key = qEl.value.trim().toLowerCase();
    var base = records.filter(inFilter);
    var shown = base.filter(function(r){
      if(!key) return true;
      return [r.name, r.rel, r.type, r.occ, r.loc, r.gift, r.note].join(' ').toLowerCase().indexOf(key) > -1;
    });
    shown.sort(function(a,b){
      var da = a.date || '', db = b.date || '';
      if(da === db) return (b.id > a.id) ? 1 : -1;
      return da < db ? 1 : -1;
    });

    lastShown = shown;
    var st = stats(base);
    $('sumOut').textContent = money(st.o);
    $('sumIn').textContent = money(st.i);
    $('rangeTip').textContent = rangeLabel() + ' · ' + st.n + ' 笔';
    $('chips').style.display = '';
    var sb2 = document.querySelector('.searchbar');
    if(sb2) sb2.style.display = '';
    $('count').textContent = key ? ('匹配 ' + shown.length + ' 笔') : ('共 ' + shown.length + ' 笔');
    $('clr').style.display = key ? 'block' : 'none';

    $('scopebar').classList.toggle('on', viewMode === 'table');
    if(viewMode === 'table'){ renderTable(shown, st); return; }
    $('sheetWrap').innerHTML = '';
    listEl.style.display = '';

    if(!shown.length){
      listEl.innerHTML = '<div class="empty">' +
        (records.length ? '<div class="big">这个范围里没有记录</div>换个时间段或关键词试试' :
         '<div class="big">还没有记录</div>点下面「＋ 记一笔」开始记账<br>也可以点「导入旧账」把以前的数据导进来') +
        '</div>';
      return;
    }

    var visible = shown.slice(0, filter.limit);
    var html = '', lastMonth = '';
    visible.forEach(function(r){
      var m = (r.date || '').slice(0,7);
      if(m !== lastMonth){
        lastMonth = m;
        var rowsThisMonth = shown.filter(function(x){ return (x.date||'').slice(0,7) === m; });
        var ms = stats(rowsThisMonth);
        html += '<div class="monthHead"><b>' + (m ? (m.slice(0,4)+' 年 '+(parseInt(m.slice(5),10))+' 月') : '未填日期') +
          '</b><span>送 ' + money(ms.o) + ' · 收 ' + money(ms.i) + '</span></div>';
      }
      html += itemHtml(r);
    });
    if(shown.length > visible.length){
      html += '<button class="more" id="moreBtn">显示更多（还有 ' + (shown.length - visible.length) + ' 笔）</button>';
    }
    listEl.innerHTML = html;

    var mb = $('moreBtn');
    if(mb) mb.onclick = function(){ filter.limit += PAGE; render(); };
  }

  function renderTable(shown, st){
    listEl.style.display = 'none';

    var rowsData = shown.filter(function(r){
      var onlyGift = !num(r.out) && !num(r.inn) && !!r.gift;
      if(tableScope === 'out') return num(r.out) > 0 || onlyGift;
      if(tableScope === 'in') return num(r.inn) > 0 || onlyGift;
      return true;
    });

    if(!records.length){
      $('sheetWrap').innerHTML = '<div class="empty"><div class="big">还没有记录</div>点下面「＋ 记一笔」开始记账</div>';
      return;
    }

    // 按拼音（首字母）排序，同姓再按日期从近到远
    try{
      var coll = new Intl.Collator('zh-Hans-CN', {usage:'sort'});
      rowsData.sort(function(a,b){
        var c = coll.compare(a.name || '', b.name || '');
        if(c !== 0) return c;
        return (b.date || '').localeCompare(a.date || '');
      });
    }catch(e){
      rowsData.sort(function(a,b){ return (a.name || '').localeCompare(b.name || ''); });
    }

    var cols = tableScope === 'out'
      ? ['日期','姓名','地点','礼物','支出']
      : (tableScope === 'in' ? ['日期','姓名','地点','礼物','收入'] : ['日期','姓名','地点','礼物','收入','支出']);

    var body = '';
    if(!rowsData.length){
      body = '<tr><td colspan="' + (cols.length + (selMode ? 1 : 0)) + '" style="text-align:center;color:#7C6459">这里还没有记录</td></tr>';
    } else {
      rowsData.forEach(function(r){
        var cells = (selMode ? '<td class="ckcell">' + (selIds[r.id] ? '✓' : '') + '</td>' : '') + '<td>' + esc(r.date || '') + '</td><td>' + esc(r.name || '') + '</td><td>' + esc(r.loc || '') + '</td><td class="giftcell">' + esc(r.gift || '') + '</td>';
        if(tableScope === 'out'){ cells += '<td class="n out">' + (num(r.out) ? money(num(r.out)) : '') + '</td>'; }
        else if(tableScope === 'in'){ cells += '<td class="n in">' + (num(r.inn) ? money(num(r.inn)) : '') + '</td>'; }
        else {
          cells += '<td class="n in">' + (num(r.inn) ? money(num(r.inn)) : '') + '</td>' +
                   '<td class="n out">' + (num(r.out) ? money(num(r.out)) : '') + '</td>';
        }
        body += '<tr data-id="' + r.id + '"' + (selMode && selIds[r.id] ? ' class="selon"' : '') + '>' + cells + '</tr>';
      });
    }

    var so = 0, si = 0;
    rowsData.forEach(function(r){ so += num(r.out); si += num(r.inn); });

    var footCells = (selMode ? '<td class="ckcell"></td>' : '') + '<td>合计</td><td>' + rowsData.length + ' 笔</td><td></td><td></td>';
    if(tableScope === 'out'){ footCells += '<td class="n out">' + money(so) + '</td>'; }
    else if(tableScope === 'in'){ footCells += '<td class="n in">' + money(si) + '</td>'; }
    else { footCells += '<td class="n in">' + money(si) + '</td><td class="n out">' + money(so) + '</td>'; }

    var colgroup = '';
    var head = '<tr>' + (selMode ? '<th class="ckcell"></th>' : '') + cols.map(function(c){ return '<th>' + c + '</th>'; }).join('') + '</tr>';
    $('sheetWrap').innerHTML =
      '<div class="sheetbox"><table class="gridtbl">' + colgroup + '<thead>' + head + '</thead><tbody>' + body +
      '<tr style="background:var(--soft);font-weight:700;font-size:12px">' + footCells + '</tr>' +
      '</tbody></table></div>' +
      '<div class="sheetfoot">按姓名首字母排序 · 共 ' + rowsData.length + ' 行 · ' +
        (selMode ? '点一行选中，再点底部「删除所选」' : '点一行可编辑') + '</div>';

    lastShown = rowsData;

    Array.prototype.forEach.call($('sheetWrap').querySelectorAll('tr[data-id]'), function(tr){
      tr.onclick = function(){
        var id = tr.getAttribute('data-id');
        if(selMode){
          var on;
          if(selIds[id]){ delete selIds[id]; on = false; } else { selIds[id] = true; on = true; }
          tr.classList.toggle('selon', on);
          var c = tr.querySelector('.ckcell'); if(c) c.textContent = on ? '✓' : '';
          syncSel(); return;
        }
        var rec = records.filter(function(x){ return x.id === id; })[0];
        if(rec) openSheet(rec, []);
      };
    });
  }

  /* ---------- 回收站 ---------- */
  function renderTrash(){
    $('scopebar').classList.remove('on');
    $('sheetWrap').innerHTML = '';
    listEl.style.display = '';
    var sb = document.querySelector('.searchbar');
    if(sb) sb.style.display = 'none';
    $('chips').style.display = 'none';
    $('count').textContent = '回收站 · ' + trash.length + ' 条目';
    $('rangeTip').textContent = '删掉的记录先放这里，最多存 ' + TRASH_MAX + ' 条，超出后最旧的自动清掉';
    $('sumOut').textContent = money(0);
    $('sumIn').textContent = money(0);

    var html = '<div class="trashHead"><b>回收站</b><span id="trashBack">← 回到账本</span></div>';
    if(!trash.length){
      html += '<div class="empty"><div class="big">回收站是空的</div>删掉的记录会先放这里，' + TRASH_MAX + ' 条以内都能恢复</div>';
    } else {
      trash.forEach(function(t){
        var amt = num(t.out) > 0 ? '<span class="amt out">−' + money(num(t.out)) + '</span>'
                : (num(t.inn) > 0 ? '<span class="amt in">+' + money(num(t.inn)) + '</span>'
                : '<span class="amt" style="color:#B9A296">—</span>');
        var when = t.deletedAt ? new Date(t.deletedAt).toLocaleDateString('zh-CN') : '';
        html += '<div class="item trashItem" data-tid="' + t.id + '">' +
          '<div class="top"><div class="who"><span class="name">' + esc(t.name || '未填姓名') + '</span>' +
            (t.rel ? '<span class="tag">' + esc(t.rel) + '</span>' : '') +
          '</div>' + amt + '</div>' +
          '<div class="meta"><span class="occ">' + esc(t.date || '') + (t.loc ? ' · ' + esc(t.loc) : '') + '</span>' +
            '<span class="date">' + (when ? '删于 ' + when : '') + '</span></div>' +
          '<div class="trashActs">' +
            '<button class="tbtn restore" data-act="restore" data-tid="' + t.id + '">恢复</button>' +
            '<button class="tbtn kill" data-act="kill" data-tid="' + t.id + '">彻底删</button>' +
          '</div>' +
        '</div>';
      });
      html += '<button class="more" id="trashClear">清空回收站（全部彻底删除）</button>';
    }
    listEl.innerHTML = html;

    $('trashBack').onclick = function(){ viewMode = 'card'; render(); };
    var tc = $('trashClear');
    if(tc) tc.onclick = function(){
      askConfirm('清空回收站？这 ' + trash.length + ' 条会彻底删掉，不能再恢复。', function(){
        trash = []; saveTrash(); render(); toast('回收站已清空');
      }, '确定清空');
    };
    Array.prototype.forEach.call(listEl.querySelectorAll('.tbtn'), function(btn){
      btn.onclick = function(e){
        e.stopPropagation();
        var tid = btn.getAttribute('data-tid'), act = btn.getAttribute('data-act');
        var item = trash.filter(function(t){ return t.id === tid; })[0];
        if(!item) return;
        if(act === 'restore'){
          var back = JSON.parse(JSON.stringify(item)); delete back.deletedAt;
          records = records.concat([back]);
          trash = trash.filter(function(t){ return t.id !== tid; });
          save(); saveTrash(); render(); toast('已恢复到账本');
        } else {
          trash = trash.filter(function(t){ return t.id !== tid; });
          saveTrash(); render(); toast('已彻底删除');
        }
      };
    });
  }

  function itemHtml(r){
    var amt;
    if(num(r.out) > 0){ amt = '<span class="amt out">−' + money(num(r.out)) + '</span>'; }
    else if(num(r.inn) > 0){ amt = '<span class="amt in">+' + money(num(r.inn)) + '</span>'; }
    else { amt = '<span class="amt" style="color:#B9A296">—</span>'; }

    var pc = picIndex[r.id] || 0;
    var on = selMode && !!selIds[r.id];
    var who = '<div class="who">' +
        '<span class="name">' + esc(r.name || '未填姓名') + '</span>' +
        (r.rel ? '<span class="tag">' + esc(r.rel) + '</span>' : '') +
        (r.type ? '<span class="tag type">' + esc(r.type) + '</span>' : '') +
        (pc ? '<span class="tag pic">照片 ' + pc + '</span>' : '') +
      '</div>';
    var left = selMode
      ? '<div class="leftWrap"><span class="ck">' + (on ? '✓' : '') + '</span>' + who + '</div>'
      : who;
    return '<div class="item' + (on ? ' selon' : '') + '" data-id="' + r.id + '">' +
      '<div class="top">' + left + amt + '</div>' +
      '<div class="meta"><span class="occ">' + esc(r.occ || '未填事由') + (r.loc ? ' · ' + esc(r.loc) : '') + '</span><span class="date">' + esc(r.date || '') + '</span></div>' +
      (r.gift ? '<div class="giftline">礼物：' + esc(r.gift) + '</div>' : '') +
      (r.note ? '<div class="note">' + esc(r.note) + '</div>' : '') +
    '</div>';
  }

  /* ---------- 表单 ---------- */
  function openSheet(rec, photos){
    editingId = rec ? rec.id : null;
    pending = (photos || []).slice();
    $('formTitle').textContent = rec ? '编辑记录' : '记一笔';
    $('delBtn').style.display = rec ? 'block' : 'none';
    $('fDate').value = rec ? rec.date : today();
    $('fName').value = rec ? rec.name : '';
    $('fRel').value = rec ? rec.rel : '亲戚';
    $('fType').value = rec ? rec.type : '婚嫁';
    $('fOcc').value = rec ? rec.occ : '';
    $('fLoc').value = rec ? (rec.loc || '') : '';
    $('fGift').value = rec ? (rec.gift || '') : '';
    $('fOut').value = rec && num(rec.out) ? rec.out : '';
    $('fIn').value = rec && num(rec.inn) ? rec.inn : '';
    $('fNote').value = rec ? (rec.note || '') : '';
    renderThumbs();
    mask.classList.add('on');
    sheet.classList.add('on');
  }
  function closeSheet(){
    mask.classList.remove('on'); sheet.classList.remove('on');
    editingId = null; pending = []; renderThumbs();
  }

  function renderThumbs(){
    var box = $('thumbs');
    previewUrls.forEach(function(u){ URL.revokeObjectURL(u); });
    previewUrls = [];
    box.innerHTML = pending.map(function(src, i){
      return '<div class="thumb"><img src="' + src + '" alt="凭证' + (i+1) + '">' +
        '<button class="kill" data-i="' + i + '" type="button">×</button></div>';
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('.thumb img'), function(img){
      img.onclick = function(){ viewImage(img.src); };
    });
    Array.prototype.forEach.call(box.querySelectorAll('.kill'), function(b){
      b.onclick = function(e){
        e.stopPropagation();
        var i = parseInt(b.getAttribute('data-i'), 10);
        pending.splice(i, 1);
        renderThumbs();
      };
    });
  }

  function viewImage(src){
    $('viewerImg').src = src;
    $('viewer').classList.add('on');
  }
  $('viewerClose').onclick = function(){ $('viewer').classList.remove('on'); $('viewerImg').src = ''; };
  $('viewer').onclick = function(e){ if(e.target === $('viewer')) { $('viewer').classList.remove('on'); } };

  /* ---------- 拍照 / 相册 ---------- */
  var fileInput = $('fileInput');
  $('cameraBtn').onclick = function(){
    lastPhotoTarget = 'camera';
    fileInput.setAttribute('capture', 'environment');
    fileInput.click();
  };
  $('albumBtn').onclick = function(){
    lastPhotoTarget = 'album';
    fileInput.removeAttribute('capture');
    fileInput.click();
  };

  fileInput.onchange = function(){
    var files = fileInput.files;
    if(!files || !files.length) return;
    if(pending.length + files.length > 3){ toast('最多 3 张，多的先不放了'); }
    var room = Math.max(0, 3 - pending.length);
    var list = Array.prototype.slice.call(files, 0, room);
    var done = 0;
    list.forEach(function(file){
      compress(file, function(dataUrl){
        pending.push(dataUrl);
        done++;
        if(done === list.length){ renderThumbs(); }
      });
    });
    fileInput.value = '';
  };

  function compress(file, cb){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var max = 1280, w = img.width, h = img.height;
      if(w > h && w > max){ h = Math.round(h * max / w); w = max; }
      else if(h >= w && h > max){ w = Math.round(w * max / h); h = max; }
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      var out = cv.toDataURL('image/jpeg', 0.72);
      cb(out);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); cb(null); };
    img.src = url;
  }

  function askConfirm(msg, onYes, yesText){
    $('cbText').textContent = msg;
    $('cbYes').textContent = yesText || '确定删除';
    $('confirmbox').classList.add('on');
    $('cbYes').onclick = function(){ $('confirmbox').classList.remove('on'); onYes(); };
    $('cbNo').onclick = function(){ $('confirmbox').classList.remove('on'); };
  }

  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(t._tm); t._tm = setTimeout(function(){ t.classList.remove('on'); }, 1800);
  }

  /* ---------- 事件 ---------- */
  $('vCard').onclick = function(){
    viewMode = 'card'; $('vCard').classList.add('on'); $('vTable').classList.remove('on'); render();
  };
  $('vTable').onclick = function(){
    viewMode = 'table'; $('vTable').classList.add('on'); $('vCard').classList.remove('on'); render();
  };

  Array.prototype.forEach.call($('scopebar').querySelectorAll('.sb'), function(b){
    b.onclick = function(){
      Array.prototype.forEach.call($('scopebar').querySelectorAll('.sb'), function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      tableScope = b.getAttribute('data-scope');
      render();
    };
  });

  $('addBtn').onclick = function(){ openSheet(null, []); };
  $('cancelBtn').onclick = closeSheet;
  mask.onclick = closeSheet;

  $('saveBtn').onclick = function(){
    var name = $('fName').value.trim();
    var out = num($('fOut').value), inn = num($('fIn').value);
    if(!name){ toast('请先填姓名'); $('fName').focus(); return; }
    var gift = $('fGift').value.trim();
    if(out <= 0 && inn <= 0 && !gift){ toast('金额或礼物至少填一项'); return; }

    var data = {
      id: editingId || uid(),
      date: $('fDate').value || today(),
      name: name, rel: $('fRel').value, type: $('fType').value,
      occ: $('fOcc').value.trim(), loc: $('fLoc').value.trim(), gift: $('fGift').value.trim(),
      out: out > 0 ? out : '', inn: inn > 0 ? inn : '',
      note: $('fNote').value.trim()
    };
    var isEdit = !!editingId;
    if(isEdit){ records = records.map(function(r){ return r.id === editingId ? data : r; }); }
    else { records.push(data); }

    var photos = pending.slice();
    if(photos.length){
      picIndex[data.id] = photos.length;
      idbPut(data.id, photos).catch(function(){ toast('照片保存失败'); });
    } else if(isEdit){
      delete picIndex[data.id];
    }
    saveIdx();

    save(); filter.limit = Math.max(filter.limit, PAGE); render(); closeSheet();
    toast(isEdit ? '已更新' : (photos.length ? '已记上，照片已存' : '已记上'));
  };

  $('delBtn').onclick = function(){
    if(!editingId) return;
    askConfirm('删除这笔记录？会先放进回收站，需要时能恢复。', function(){
      var id = editingId;
      var rec = records.filter(function(r){ return r.id === id; })[0];
      if(rec) toTrash(rec);
      records = records.filter(function(r){ return r.id !== id; });
      delete picIndex[id]; idbDel(id); saveIdx();
      save(); render(); closeSheet(); toast('已移入回收站');
    }, '移到回收站');
  };

  listEl.onclick = function(e){
    var node = e.target.closest ? e.target.closest('.item') : null;
    if(!node) return;
    var id = node.getAttribute('data-id');
    if(selMode){
      if(selIds[id]) delete selIds[id]; else selIds[id] = true;
      node.classList.toggle('selon', !!selIds[id]);
      var ck = node.querySelector('.ck'); if(ck) ck.textContent = selIds[id] ? '✓' : '';
      syncSel(); return;
    }
    var rec = records.filter(function(r){ return r.id === id; })[0];
    if(!rec) return;
    if(picIndex[id]){
      idbGet(id).then(function(arr){ openSheet(rec, arr || []); });
    } else {
      openSheet(rec, []);
    }
  };

  /* ---------- 批量删除 ---------- */
  function syncSel(){
    var n = Object.keys(selIds).length;
    $('selInfo').textContent = '已选 ' + n + ' 笔';
    $('selAllBtn').textContent = (n && n === lastShown.length) ? '取消全选' : '全选';
  }
  function enterSel(){
    if(!records.length){ toast('还没有记录'); return; }
    selMode = true; selIds = {};
    $('selbar').classList.add('on');
    $('addBtn').style.display = 'none';
    render(); syncSel();
    toast('点记录选中，再点「删除所选」');
  }
  function exitSel(){
    selMode = false; selIds = {};
    $('selbar').classList.remove('on');
    $('addBtn').style.display = '';
    render();
  }
  $('selBtn').onclick = enterSel;
  $('trashBtn').onclick = function(){
    if(!trash.length){ toast('回收站是空的'); return; }
    viewMode = 'trash'; render();
  };
  $('selExitBtn').onclick = exitSel;
  $('selAllBtn').onclick = function(){
    var n = Object.keys(selIds).length;
    if(n && n === lastShown.length){ selIds = {}; render(); syncSel(); return; }
    selIds = {};
    lastShown.forEach(function(r){ selIds[r.id] = true; });
    render(); syncSel();
  };
  $('selDelBtn').onclick = function(){
    var ids = Object.keys(selIds);
    if(!ids.length){ toast('先选中要删的记录'); return; }
    askConfirm('删除选中的 ' + ids.length + ' 笔记录？会先放进回收站，需要时能恢复。', function(){
      ids.forEach(function(id){
        var rec = records.filter(function(r){ return r.id === id; })[0];
        if(rec) toTrash(rec);
        delete picIndex[id]; idbDel(id);
      });
      records = records.filter(function(r){ return !selIds[r.id]; });
      saveIdx(); save(); selIds = {};
      render(); syncSel();
      toast('已移入回收站 ' + ids.length + ' 笔');
      if(!records.length) exitSel();
    }, '移到回收站 ' + ids.length + ' 笔');
  };

  qEl.oninput = render;
  $('clr').onclick = function(){ qEl.value = ''; render(); qEl.focus(); };

  /* ---------- 时间筛选 ---------- */
  var chips = $('chips');
  chips.onclick = function(e){
    var btn = e.target.closest ? e.target.closest('.chip') : null;
    if(!btn) return;
    var mode = btn.getAttribute('data-mode');
    var now = new Date();

    Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function(c){ c.classList.remove('on'); });
    btn.classList.add('on');
    $('panelPick').classList.remove('on');
    $('panelRange').classList.remove('on');
    filter.limit = PAGE; filter.from = ''; filter.to = '';

    if(mode === 'all'){ filter.mode = 'all'; }
    else if(mode === 'year'){ filter.mode = 'year'; filter.year = now.getFullYear(); }
    else if(mode === 'month'){ filter.mode = 'month'; filter.year = now.getFullYear(); filter.month = now.getMonth()+1; }
    else if(mode === 'lastmonth'){
      var y = now.getFullYear(), m = now.getMonth()+1; m -= 1;
      if(m === 0){ m = 12; y -= 1; }
      filter.mode = 'month'; filter.year = y; filter.month = m;
    }
    else if(mode === 'pick'){
      filter.mode = 'month';
      filter.year = parseInt($('fYear').value, 10) || now.getFullYear();
      filter.month = parseInt($('fMonth').value, 10) || (now.getMonth()+1);
      $('panelPick').classList.add('on');
    }
    else if(mode === 'range'){
      filter.mode = 'range'; filter.from = $('fFrom').value; filter.to = $('fTo').value;
      $('panelRange').classList.add('on');
    }
    render();
  };

  $('pickGo').onclick = function(){
    filter.mode = 'month';
    filter.year = parseInt($('fYear').value, 10);
    filter.month = parseInt($('fMonth').value, 10);
    filter.limit = PAGE; render(); toast(rangeLabel() + ' 的记录');
  };

  $('rangeGo').onclick = function(){
    var f = $('fFrom').value, t = $('fTo').value;
    if(!f && !t){ toast('请至少选一个日期'); return; }
    if(f && t && f > t){ toast('结束日期不能早于起始日期'); return; }
    filter.mode = 'range'; filter.from = f; filter.to = t; filter.limit = PAGE;
    render(); toast('已筛出这段时间的记录');
  };

  (function initSelects(){
    var now = new Date(), y = now.getFullYear();
    var yearSel = $('fYear'), monthSel = $('fMonth');
    for(var i = y; i >= y - 30; i--){
      var o = document.createElement('option'); o.value = i; o.textContent = i + ' 年'; yearSel.appendChild(o);
    }
    for(var m = 1; m <= 12; m++){
      var om = document.createElement('option'); om.value = m; om.textContent = m + ' 月'; monthSel.appendChild(om);
    }
    yearSel.value = y; monthSel.value = now.getMonth()+1;
  })();

  /* ---------- 导出 / 导入 ---------- */
  function backupFileName(){
    var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
    return '礼金往来账本备份_' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '.xls';
  }

  function buildBackupBlob(){
    var head = ['日期','姓名','关系','事类','事由','地点','礼物','支出','收入','备注'];
    var escHtml = function(v){ return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,' '); };
    var tds = function(arr, tag){ return '<tr>' + arr.map(function(v){ return '<' + tag + '>' + escHtml(v) + '</' + tag + '>'; }).join('') + '</tr>'; };
    var body = records.map(function(r){
      return tds([r.date, r.name, r.rel, r.type, r.occ, r.loc || '', r.gift || '', num(r.out) || '', num(r.inn) || '', r.note || ''], 'td');
    }).join('');
    var html = '<html><head><meta charset="utf-8"></head><body><table border="1">'
      + tds(head, 'th') + body + '</table></body></html>';
    return new Blob(['\uFEFF' + html], {type:'application/vnd.ms-excel;charset=utf-8'});
  }

  function backupText(){
    var head = ['日期','姓名','关系','事类','事由','地点','礼物','支出','收入','备注'].join('\t');
    var lines = records.map(function(r){
      return [r.date, r.name, r.rel, r.type, r.occ, r.loc || '', r.gift || '', num(r.out) || '', num(r.inn) || '', (r.note || '').replace(/\t/g,' ')].join('\t');
    });
    return head + '\n' + lines.join('\n');
  }

  function doDownload(blob, fileName){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = fileName; a.rel = 'noopener';
    a.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
    document.body.appendChild(a);
    var supported = ('download' in a);
    try{ a.click(); }catch(e){ supported = false; }
    if(!supported){ try{ window.open(url, '_blank'); }catch(e2){ window.location.href = url; } }
    setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); }, 500);
    toast('已开始导出：' + fileName + '（在 文件管理→下载 里找）');
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  }

  function exportDialog(fileName, blob){
    var old = document.getElementById('expbox'); if(old && old.parentNode) old.parentNode.removeChild(old);
    var wrap = document.createElement('div');
    wrap.id = 'expbox';
    wrap.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;';
    var canShare = false;
    try{
      if(navigator.canShare && window.File){
        canShare = navigator.canShare({files:[new File([blob], fileName, {type:'application/vnd.ms-excel'})]});
      }
    }catch(e){ canShare = false; }
    var box = document.createElement('div');
    box.style.cssText = 'background:#fff;border-radius:16px;max-width:430px;width:100%;padding:18px 18px 16px;box-sizing:border-box;font-size:15px;line-height:1.55;box-shadow:0 12px 34px rgba(0,0,0,.22);max-height:86vh;overflow:auto;';
    box.innerHTML =
      '<div style="font-size:17px;font-weight:700;margin-bottom:10px;">导出备份</div>'
      + '<div>文件名：<span style="font-weight:600;word-break:break-all;">' + fileName + '</span></div>'
      + '<div>共 ' + records.length + ' 笔记录</div>'
      + '<div style="margin-top:10px;padding:10px 12px;background:#f6f6f6;border-radius:10px;color:#555;font-size:13.5px;">'
      + '确认后会存到手机的「下载 / Download」文件夹：<br>'
      + '· 安卓：文件管理 → 下载（或 Download）<br>'
      + '· 苹果：文件 App → 下载项 / 我的 iPhone<br>'
      + '找不到就点「分享到微信」，在聊天里点开文件再长按保存，最稳。</div>'
      + '<div id="expBtns" style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:flex-end;"></div>';
    wrap.appendChild(box);
    document.body.appendChild(wrap);

    var btns = box.querySelector('#expBtns');
    var mk = function(txt, primary, small){
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = txt;
      b.style.cssText = 'border:0;border-radius:10px;padding:' + (small ? '8px 12px' : '11px 16px') + ';font-size:' + (small ? '13.5px' : '15px') + ';' +
        (primary ? 'background:#2f7d4f;color:#fff;font-weight:600;' : 'background:#efefef;color:#333;');
      btns.appendChild(b);
      return b;
    };
    var close = function(){ if(wrap.parentNode) wrap.parentNode.removeChild(wrap); };

    var copy = mk('复制表格内容', false, true);
    copy.onclick = function(){
      var text = backupText();
      var done = function(){ close(); toast('已复制，可直接粘到 WPS / 微信里'); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done, function(){ legacyCopy(text); done(); });
      } else { legacyCopy(text); done(); }
    };

    if(canShare){
      var share = mk('分享到微信', false);
      share.onclick = function(){
        var file;
        try{ file = new File([blob], fileName, {type:'application/vnd.ms-excel'}); }catch(e){ return; }
        navigator.share({files:[file], title:fileName}).then(function(){ close(); toast('已发送，在聊天里长按文件保存'); })
          .catch(function(){});
      };
    }

    var cancel = mk('取消', false);
    cancel.onclick = close;

    var ok = mk('确认导出', true);
    ok.onclick = function(){ close(); doDownload(blob, fileName); };

    wrap.onclick = function(e){ if(e.target === wrap) close(); };
  }

  function legacyCopy(text){
    try{
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, ta.value.length);
      document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){}
  }

  $('exportBtn').onclick = function(){
    if(!records.length){ toast('还没有记录'); return; }
    var fileName = backupFileName();
    var blob = buildBackupBlob();
    exportDialog(fileName, blob);
  };

  $('importBtn').onclick = function(){
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.csv,.json,.txt,.xls,.html';
    inp.onchange = function(){
      var f = inp.files[0]; if(!f) return;
      var reader = new FileReader();
      reader.onload = function(){
        var text = String(reader.result || '');
        try{
          var incoming;
          if(f.name.toLowerCase().slice(-4) === 'json'){
            incoming = JSON.parse(text).map(function(r){
              return {id: uid(), date: (r.date||'').slice(0,10), name: r.name||'', rel: r.rel||'',
                      type: r.type||'', occ: r.occ||'', loc: r.loc||'', gift: r.gift||'', out: num(r.out), inn: num(r.inn), note: r.note||''};
            });
          } else if(/<table/i.test(text)){
            incoming = parseHtmlTable(text);
          } else {
            incoming = parseCsv(text);
          }
          if(!incoming.length){ toast('没读到可导入的记录'); return; }
          askConfirm('将导入 ' + incoming.length + ' 条记录并与现有记录合并，继续？', function(){
            records = records.concat(incoming);
            save(); filter.limit = PAGE; render(); toast('已导入 ' + incoming.length + ' 笔');
          }, '确定导入');
        }catch(err){ toast('文件格式不对，导入失败'); }
      };
      reader.readAsText(f, 'utf-8');
    };
    inp.click();
  };

  function headerIndex(headerVals){
    var alias = {'日期':'date','姓名':'name','关系':'rel','事类':'type','事由':'occ','地点':'loc','礼物':'gift','礼品':'gift','实物':'gift','支出':'out','收入':'inn','备注':'note','我送出':'out','我收到':'inn','照片数':'skip'};
    var idx = {date:0,name:1,rel:2,type:3,occ:4,loc:-1,gift:-1,out:5,inn:6,note:7};
    var found = false;
    (headerVals || []).forEach(function(h, i){
      var k = alias[(h || '').replace(/\s/g,'')];
      if(k){ if(k !== 'skip' && idx[k] !== i) { idx[k] = i; } found = true; }
    });
    if(!found){ idx.loc = -1; }
    return idx;
  }

  function rowFromCells(vals, idx){
    var g = function(k){ return idx[k] >= 0 ? (vals[idx[k]] || '') : ''; };
    return {
      id: uid(),
      date: normalizeDate(g('date')),
      name: g('name'),
      rel: g('rel'), type: g('type'), occ: g('occ'), loc: g('loc'), gift: g('gift'),
      out: num(g('out')), inn: num(g('inn')), note: g('note')
    };
  }

  function parseHtmlTable(text){
    var doc = new DOMParser().parseFromString(text, 'text/html');
    var rows = doc.querySelectorAll('table tr');
    var out = [], idx = null;
    Array.prototype.forEach.call(rows, function(row, i){
      var vals = Array.prototype.map.call(row.querySelectorAll('th,td'), function(c){ return (c.textContent || '').trim(); });
      if(!idx){ idx = headerIndex(vals); return; }
      if(vals.length < 2) return;
      out.push(rowFromCells(vals, idx));
    });
    return out;
  }

  function parseCsv(text){
    var lines = text.replace(/\r/g,'').split('\n').filter(function(l){ return l.trim() !== ''; });
    if(!lines.length) return [];
    var splitRow = function(line){
      var cells = line.match(/("([^"]|"")*"|[^,]*)(,|$)/g) || [];
      return cells.map(function(c){ return c.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"'); });
    };
    var idx = headerIndex(splitRow(lines[0]));
    var out = [];
    for(var i = 1; i < lines.length; i++){
      var clean = splitRow(lines[i]);
      if(clean.length < 2) continue;
      out.push(rowFromCells(clean, idx));
    }
    return out;
  }

  function normalizeDate(v){
    var s = String(v || '').trim().replace(/\//g,'-');
    var m = s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if(m) return m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);
    return s;
  }

  render();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
</script>
